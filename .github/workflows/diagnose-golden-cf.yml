name: Вспомогательный — эталоны конфигурации по версиям (ibcmd)

# Назначение: собрать эталоны (golden) выгрузки исходников для НЕСКОЛЬКИХ версий платформы 1С за один прогон —
# источник значений по умолчанию для scaffold (в XSD их нет, проверено). Перебирает версии ПО ВОЗРАСТАНИЮ,
# на каждой: ставит платформу (как namespace-forest), создаёт ИБ, импортирует «семя» (объекты, созданные
# md-sparrow — по одному каждого вида), применяет и ВЫГРУЖАЕТ дамп через `ibcmd infobase config export`
# (без DESIGNER → без лицензии 1С). Результат — артефакт `golden/<формат>/cf/...` на каждую версию.
#
# Вспомогательный и повторно запускаемый: указываешь версии — получаешь артефакты; так можно добирать
# эталоны на новые форматы в будущем.
#
# Семя в формате 2.20 импортируется в платформы 2.20+ (новый формат в старую ИБ не грузится). Чтобы получить
# эталоны форматов < 2.20, нужно семя в соответствующем (более старом) формате — генерация таких семян
# появится после расширения scaffold (см. docs/scaffold-golden.md).

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Версии платформы через пробел, ПО ВОЗРАСТАНИЮ (например "8.3.27.1486 8.5.1.123")'
        required: true
      seed_path:
        description: 'Каталог src/cf «семени» (в submodule samples-1c-platform); пусто = пустая ИБ'
        required: false
        default: 'fixtures/samples-1c-platform/seed/src/cf'

concurrency:
  group: diagnose-golden-cf
  cancel-in-progress: false

jobs:
  golden:
    name: Эталоны конфигурации
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    permissions:
      contents: read

    steps:
      - name: Checkout (с submodule samples для семени)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Установить OneScript
        uses: otymko/setup-onescript@v1.5.1
        with:
          version: stable

      - name: Установить yard
        run: |
          opm install opm
          opm install yard
          YARD_OS=$(find "$HOME/.local/share/ovm" -path '*/yard/src/yard.os' 2>/dev/null | head -1)
          if [ -z "$YARD_OS" ]; then echo "ERROR: yard.os не найден"; exit 1; fi
          echo "YARD_OS=$YARD_OS" >> "$GITHUB_ENV"

      - name: Установить зависимости платформы 1С
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fontconfig libgsf-1-114 libglib2.0-0 libodbc1 libwebkit2gtk-4.0-37 \
            xvfb unzip curl
          LE_BASE=http://archive.ubuntu.com/ubuntu/pool/universe/e/enchant/
          LE_FILE=$(curl -s "$LE_BASE" | grep -oE 'libenchant1c2a_[^"]*_amd64\.deb' | head -1)
          curl -sL "$LE_BASE$LE_FILE" -o /tmp/libenchant.deb
          sudo apt-get install -y /tmp/libenchant.deb

      - name: Собрать эталоны по версиям
        env:
          YARD_RELEASES_USER: ${{ secrets.ONEC_LOGIN }}
          YARD_RELEASES_PWD: ${{ secrets.ONEC_PASSWORD }}
          VERSIONS: ${{ inputs.versions }}
          SEED_PATH: ${{ inputs.seed_path }}
        run: |
          set +e
          REPO_DIR=$(pwd)
          GOLDEN_DIR="$REPO_DIR/golden"
          mkdir -p "$GOLDEN_DIR"
          SEED_ABS=""
          if [ -n "$SEED_PATH" ]; then
            SEED_ABS="$REPO_DIR/$SEED_PATH"
            [ -d "$SEED_ABS" ] || { echo "ERROR: seed_path не найден: $SEED_ABS"; exit 1; }
          fi

          for PLATFORM_VERSION in $VERSIONS; do
            echo "===================== $PLATFORM_VERSION ====================="
            DISTR_DIR=$(mktemp -d); chmod 777 "$DISTR_DIR"
            ESCAPED_VERSION=$(echo "$PLATFORM_VERSION" | sed 's/\./\\./g')
            APP_MAJOR=$(echo "$PLATFORM_VERSION" | cut -d. -f1,2)
            DISTR_FILTERS=(
              "[CС]ервер.+\(64-bit\) для DEB-based Linux-систем$"
              "Технологическая платформа.+\(64-bit\) для Linux$"
            )
            OK=0
            for ATTEMPT in 1 2 3; do
              for DF in "${DISTR_FILTERS[@]}"; do
                timeout 900 oscript "$YARD_OS" releases get \
                  --app-filter "Технологическая платформа $APP_MAJOR\$" \
                  --version-filter "$ESCAPED_VERSION" \
                  --distr-filter "$DF" \
                  --path "$DISTR_DIR" --download-limit 1 --extract || true
                if find "$DISTR_DIR" -type f \( -name 'setup-full*.run' -o -name '*.deb' \) | grep -q .; then OK=1; break; fi
              done
              [ "$OK" -eq 1 ] && break
              echo "Попытка $ATTEMPT — дистрибутив не получен, пауза 20с…"; sleep 20
            done
            [ "$OK" -eq 1 ] || { echo "WARN: дистрибутив $PLATFORM_VERSION не скачан, пропуск"; rm -rf "$DISTR_DIR"; continue; }

            sudo rm -rf /opt/1cv8 /opt/1C 2>/dev/null || true
            RUN_INSTALLER=$(find "$DISTR_DIR" -name 'setup-full*.run' | head -1)
            if [ -n "$RUN_INSTALLER" ]; then
              chmod +x "$RUN_INSTALLER"
              for COMPONENTS in server,client_full,v8_install_deps server,client_full; do
                if timeout 900 xvfb-run -a sudo "$RUN_INSTALLER" --mode unattended \
                  --enable-components "$COMPONENTS" > /tmp/install.log 2>&1; then break; fi
              done
            else
              DEBS=$(find "$DISTR_DIR" -name '*.deb' | sort)
              [ -n "$DEBS" ] || { echo "WARN: ни .run, ни .deb для $PLATFORM_VERSION, пропуск"; rm -rf "$DISTR_DIR"; continue; }
              timeout 600 sudo dpkg -i $DEBS > /tmp/install.log 2>&1 \
                || timeout 600 sudo apt-get install -f -y >> /tmp/install.log 2>&1
            fi

            IBCMD=$(find /opt/1cv8 /opt/1C -name 'ibcmd' -type f 2>/dev/null | sort -V | tail -1)
            [ -n "$IBCMD" ] || { echo "WARN: ibcmd не найден после установки $PLATFORM_VERSION, пропуск"; rm -rf "$DISTR_DIR"; continue; }

            DB_DIR=$(mktemp -d); DATA_DIR=$(mktemp -d); OUT_DIR=$(mktemp -d); chmod 777 "$OUT_DIR"
            # ibcmd создаёт файловую ИБ; --data нужен для 8.3.20+ (на 8.3.19 отвергается).
            DATA_ARG=""
            if ! timeout 300 "$IBCMD" infobase create --db-path="$DB_DIR" >/tmp/create.log 2>&1; then
              DATA_ARG="--data=$DATA_DIR"
              timeout 300 "$IBCMD" infobase create $DATA_ARG --db-path="$DB_DIR" >/tmp/create.log 2>&1
            fi

            if [ -n "$SEED_ABS" ]; then
              echo "Импорт семени…"
              timeout 600 "$IBCMD" infobase config import $DATA_ARG --db-path="$DB_DIR" "$SEED_ABS" > /tmp/import.log 2>&1
              if [ $? -ne 0 ]; then
                echo "WARN: config import не прошёл для $PLATFORM_VERSION (вероятно, формат семени новее платформы):"; tail -20 /tmp/import.log
                rm -rf "$DISTR_DIR" "$DB_DIR" "$DATA_DIR" "$OUT_DIR"; continue
              fi
              timeout 600 "$IBCMD" infobase config apply $DATA_ARG --db-path="$DB_DIR" --force > /tmp/apply.log 2>&1 \
                || { echo "WARN: apply:"; tail -20 /tmp/apply.log; }
            fi

            # Выгрузка дампа в XML через ibcmd (без DESIGNER → без лицензии).
            timeout 600 "$IBCMD" infobase config export $DATA_ARG --db-path="$DB_DIR" "$OUT_DIR" > /tmp/export.log 2>&1
            if [ $? -ne 0 ] || [ ! -f "$OUT_DIR/Configuration.xml" ]; then
              echo "ERROR: config export не дал Configuration.xml для $PLATFORM_VERSION:"; tail -30 /tmp/export.log
              rm -rf "$DISTR_DIR" "$DB_DIR" "$DATA_DIR" "$OUT_DIR"; continue
            fi

            FORMAT=$(grep -oE 'version="2\.[0-9]+"' "$OUT_DIR/Configuration.xml" | head -1 | grep -oE '2\.[0-9]+')
            FORMAT=${FORMAT:-unknown}
            echo "Платформа $PLATFORM_VERSION → формат $FORMAT"
            DEST="$GOLDEN_DIR/$FORMAT/cf"
            rm -rf "$DEST"; mkdir -p "$DEST"
            cp -r "$OUT_DIR"/. "$DEST/"
            rm -rf "$DISTR_DIR" "$DB_DIR" "$DATA_DIR" "$OUT_DIR"
          done

          echo "=== собранные форматы ==="
          find "$GOLDEN_DIR" -maxdepth 1 -mindepth 1 -type d | sed "s#$GOLDEN_DIR/##" | sort
          [ -n "$(ls -A "$GOLDEN_DIR" 2>/dev/null)" ] || { echo "ERROR: не собрано ни одного эталона"; exit 1; }
          exit 0

      - name: Загрузить эталоны как артефакт
        uses: actions/upload-artifact@v7
        with:
          name: golden-config-${{ github.run_id }}
          path: golden/
          if-no-files-found: error
          retention-days: 30
