# Публикует md-sparrow-*-all.jar в GitHub Release.
# Запуск: пуш тега v* или вручную (workflow_dispatch) с вводом версии.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, v0.1.0 или v0.1.0-rc.1)'
        required: true
        type: string
      draft:
        description: 'Создать черновик релиза (не публикуется публично)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Пометить релиз как предварительный (alpha/beta/rc)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Установить JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Определить версию (из тега или ввода)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION"

      - name: Обновить версию в build.gradle.kts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout main
          sed -i -E "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" build.gradle.kts
          git add build.gradle.kts
          if git diff --staged --quiet; then
            echo "Версия в build.gradle.kts уже совпадает — коммит не нужен"
          else
            git commit -m "chore(release): version ${{ steps.ver.outputs.version }}"
            git push origin main
          fi

      - name: Создать и отправить тег, если его нет (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует — пропуск"
          else
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Кэшировать cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-git-cliff-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-cliff-

      - name: Установить git-cliff
        run: |
          if ! command -v git-cliff &> /dev/null; then
            cargo install git-cliff --locked
          fi
          git-cliff --version

      - name: Сгенерировать CHANGELOG
        id: changelog
        run: |
          git-cliff --config cliff.toml --output CHANGELOG.md

          if [ -f CHANGELOG.md ]; then
            # Извлекаем только последний релиз (первый ## [version] до следующего ##)
            CHANGELOG=$(awk '
              /^## \[/ {
                if (found) exit
                found = 1
              }
              found { print }
            ' CHANGELOG.md)

            # Удаляем пустые строки в конце
            CHANGELOG=$(echo "$CHANGELOG" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')

            # Если changelog пустой или слишком короткий — fallback на историю коммитов
            if [ -z "$CHANGELOG" ] || [ ${#CHANGELOG} -lt 20 ]; then
              CHANGELOG="## Изменения\n\nСм. [историю коммитов](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref }})"
            fi
          else
            CHANGELOG="## Изменения\n\nСм. [историю коммитов](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref }})"
          fi

          # Многострочный вывод в GitHub Actions
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Закоммитить CHANGELOG
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout main
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
            if git diff --staged --quiet; then
              echo "CHANGELOG.md без изменений — коммит не нужен"
            else
              git commit -m "chore(deps): update changelog"
              git push origin main
            fi
          fi
        continue-on-error: true

      - name: Собрать fat JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Создать GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: build/libs/md-sparrow-*-all.jar
          body: |
            ## Версия ${{ steps.ver.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' || false }}
