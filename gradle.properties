# Корень submodule: каталог `resources/namespace-forest/` относительно корня репозитория md-sparrow
# (после `git submodule update --init` — см. README и .gitmodules).
# Версии форматов и их XSD открываются автоматически из resources/namespace-forest/schemas/designer/*
# (см. build.gradle.kts), bindings.xjb и catalog.xml генерируются в build/generated/xjb.
xsd.root=resources/namespace-forest

org.gradle.parallel=true
org.gradle.caching=true
# 12 полных моделей 1С (~24k классов) тяжелы для XJC/компиляции — больше heap демона
# и ограниченный параллелизм, чтобы не запускать 12 форков XJC одновременно.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=3
